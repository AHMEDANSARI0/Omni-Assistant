name: Desktop shell (Windows)

# Builds the Tauri installer for the Command Center on a real Windows runner.
#
# Why this exists: the shell can only be *built* on a machine with Rust and
# WebView2, which the development sandbox does not have. Everything that can be
# checked without them is checked here first (`scripts/check_desktop_shell.py`),
# so a configuration mistake fails in seconds instead of after a 10-minute Rust
# compile.
#
# What this workflow does NOT do: code signing. Authenticode needs the user's own
# certificate (thumbprint or PFX) and must never be committed, so signing is a
# separate, explicit step documented in INSTALLATION_GUIDE.md.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: build installer (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Preflight the desktop shell definition
        run: python scripts/check_desktop_shell.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install UI dependencies
        working-directory: frontend
        run: npm ci

      - name: Rebuild the SPA that the API serves
        working-directory: frontend
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock', 'frontend/src-tauri/Cargo.toml') }}

      - name: Build the Tauri bundle (NSIS + MSI)
        working-directory: frontend
        run: npx --yes @tauri-apps/cli@^2 build --verbose

      - name: List the produced installers
        shell: pwsh
        run: |
          $root = "frontend/src-tauri/target/release/bundle"
          if (-not (Test-Path $root)) { Write-Error "No bundle directory was produced"; exit 1 }
          Get-ChildItem -Recurse $root -Include *.exe, *.msi | ForEach-Object {
            "  {0}  {1:n0} bytes" -f $_.Name, $_.Length
          }

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: omni-command-center-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
