name: CI

# Continuous integration for the Omni-Assistant / Self-Healing PC Agent tree.
#
# Two real platforms are covered because the product is Windows-first but the
# test suite also has to stay honest on POSIX. Nothing here needs a secret: the
# suite is local-first, uses mock/local providers, and the release chain check
# signs with a throw-away key that it deletes afterwards.

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the project with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Test suite
        run: python -m pytest -q

      - name: Production readiness audit
        run: pc-agent release audit

      - name: Release chain check (build, verify, tamper, sign, stage, apply, rollback)
        run: pc-agent release production-check --out production-check.json

      - name: Upload the release chain report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-check-${{ matrix.os }}-py${{ matrix.python }}
          path: production-check.json
          if-no-files-found: ignore
          retention-days: 14

  accessibility:
    name: accessibility and i18n report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the project with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Measured WCAG contrast for the shipping palette
        run: pc-agent a11y check

      - name: Translation coverage for every locale
        run: pc-agent i18n status

      - name: Measured performance budget snapshot
        run: pc-agent perf bench --iterations 5

  package:
    name: package portable release bundle
    runs-on: windows-latest
    timeout-minutes: 40
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the project with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build the portable ZIP
        run: pc-agent release build --output dist/omni-assistant.zip

      - name: Verify the ZIP without extracting it
        run: pc-agent release verify dist/omni-assistant.zip

      - name: Build the hash-verified Inno Setup source
        run: pc-agent release installer-source --output dist/installer-source

      - name: Upload the packaging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 30
