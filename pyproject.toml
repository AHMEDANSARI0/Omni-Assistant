[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-pc-agent"
version = "0.41.0"
description = "Autonomous self-healing PC AI agent (personal local core + GUI + verification/checkpoints + file/Office operations + verified workflow reuse + multi-step planning + core self-repair + task budgets + portable production releases + direct Anthropic provider + PDF text/page transforms + scanned PDF OCR + PDF table extraction + explicit online signed update downloads + PDF form inspection/filling + direct-only PDF password protection + PDF digital-signature inspection/creation + local PDF trust-chain/CRL validation + RFC 3161 PDF timestamping + opt-in online CRL/OCSP revocation + certificate-policy/name-constraint validation + opt-in system trust-store anchors + incremental multi-signature PDF signing + DocTimeStamp-only incremental revisions + LTV DSS embedding + PAdES Baseline B-B signature profile + Windows installer source packaging + secure .env provider-key cleanup)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# Runtime dependencies are added per phase only when an implemented feature
# actually needs them. Phase 1B's PDF tools use pypdf; the Phase 4.1 TLS
# hotfix uses certifi as a portable Mozilla CA bundle. Phase 14 uses
# comtypes only on Windows for Microsoft UI Automation COM interop. Phase 15
# uses Pillow for bounded local image decoding/encoding and transformations.
# Phase 22 uses pypdfium2/PDFium only to render selected PDF pages for gated OCR.
# Phase 26 uses pypdf's crypto extra for standards-based AES PDF encryption.
dependencies = [
    "certifi>=2024.7.4",
    "pypdf[crypto]>=5.0,<7",
    "pypdfium2>=5,<6",
    "Pillow>=10.4,<14",
    "comtypes>=1.4,<2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
pc-agent = "pc_agent.cli:main"
# Minimal bootstrap for repairing core files when the full CLI cannot import.
pc-agent-self-repair = "pc_agent.self_repair_cli:main"
# Vendor-only license issuing tool; customer production builds should keep
# private keys (and may omit this launcher) off end-user machines.
pc-agent-license-admin = "pc_agent.licensing.admin:main"
# Vendor-only release bundle signing tool; keep its private keys off customer PCs.
pc-agent-release-admin = "pc_agent.release_admin:main"

[project.gui-scripts]
pc-agent-gui = "pc_agent.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".patcher-backups"]
