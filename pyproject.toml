[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-pc-agent"
version = "0.3.0"
description = "Autonomous self-healing PC AI agent (local core)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# Runtime dependencies are added per phase only when an implemented feature
# actually needs them. Phase 1B's PDF tools use pypdf.
dependencies = [
    "pypdf>=5.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
pc-agent = "pc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
